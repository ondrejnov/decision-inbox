# Replace the image and public host before applying this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agapprove-api
  namespace: apps
  labels:
    app.kubernetes.io/name: agapprove-api
    app.kubernetes.io/component: bff
spec:
  # SQLite registrations, SSE replay, and webhook idempotency require one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agapprove-api
      app.kubernetes.io/component: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agapprove-api
        app.kubernetes.io/component: bff
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.com/agapprove-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: BFF_HOST
              value: "0.0.0.0"
            - name: BFF_PORT
              value: "8787"
            - name: AGENTIS_API_URL
              value: "https://agentis.cz"
            - name: AGENTIS_SESSION_RPC
              value: "auth.user_data"
            # Set these to the Agentis egress and ingress-controller CIDRs
            # before enabling the webhook endpoint.
            - name: WEBHOOK_ALLOWED_IPS
              value: ""
            - name: TRUSTED_PROXY_CIDRS
              value: ""
            - name: SQLITE_PATH
              value: "/data/decision-inbox.sqlite"
            # Provide ADC through Workload Identity or GOOGLE_APPLICATION_CREDENTIALS
            # from a Kubernetes Secret for this Firebase project.
            - name: FIREBASE_PROJECT_ID
              value: "agentis-8f18d"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agapprove-api-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agapprove-api-data
  namespace: apps
  labels:
    app.kubernetes.io/name: agapprove-api
    app.kubernetes.io/component: bff
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agapprove-api
  namespace: apps
  labels:
    app.kubernetes.io/name: agapprove-api
    app.kubernetes.io/component: bff
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agapprove-api
    app.kubernetes.io/component: bff
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agapprove-api
  namespace: apps
  labels:
    app.kubernetes.io/name: agapprove-api
    app.kubernetes.io/component: bff
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: public
  tls:
    - hosts:
        - agapprove-api.example.com
      secretName: agapprove-api-tls
  rules:
    - host: agapprove-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agapprove-api
                port:
                  number: 80
